<section class="signup">
  <div class="container">
    <div class="auth-form" appMatchPasswordDirective>
      <div class="auth-title">Регистрация на сайте</div>
      <div class="auth-inputs">
        <div class="auth-input">
          <input type="text" name="email" placeholder="Электронная почта" formControlName="email" />
        </div>
        <div class="auth-input">
          <input type="password" name="password" placeholder="Пароль" formControlName="password" />
        </div>
        <div class="auth-input">
          <input
            type="password"
            name="passwordRepeat"
            placeholder="Повторите пароль"
            formControlName="passwordRepeat"
          />
        </div>
        <div class="auth-checkbox">
          <input type="checkbox" name="accept" id="accept" formControlName="accept" />
          <label for="accept"
            >Я принимаю <a href="">условия пользовательского соглашения</a> и даю согласие
            <a href="">на обработку персональных данных.</a></label
          >
        </div>
      </div>
      <div class="auth-button">
        <button class="button">Зарегистрироваться</button>
      </div>
      <div class="auth-link">Уже есть аккаунт? <a routerLink="/login">Войдите</a></div>
    </div>
    <div class="page-image">
      <img src="assets/images/bg-signup.png" alt="signup-img" />
    </div>
  </div>
</section>
