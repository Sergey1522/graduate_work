<section class="signup">
  <div class="container">
    <div class="auth-form" [formGroup]="signUpForm" appMatchPasswordDirective>
      <div class="auth-title">Регистрация на сайте</div>
      <div class="auth-inputs">
        <div class="auth-input">
          <input
            type="text"
            name="name"
            placeholder="Ваше имя"
            formControlName="name"
            [ngStyle]="{
              'border-color':
                signUpForm.get('name')?.invalid &&
                (signUpForm.get('name')?.dirty || signUpForm.get('name')?.touched)
                  ? 'red'
                  : '',
            }"
          />
        </div>
        <div class="auth-input">
          <input
            type="text"
            name="email"
            placeholder="Электронная почта"
            formControlName="email"
            [ngStyle]="{
              'border-color':
                signUpForm.get('email')?.invalid &&
                (signUpForm.get('email')?.dirty || signUpForm.get('email')?.touched)
                  ? 'red'
                  : '',
            }"
          />
        </div>
        <div class="auth-input">
          <input
            type="password"
            name="password"
            placeholder="Пароль"
            formControlName="password"
            [ngStyle]="{
              'border-color':
                signUpForm.get('password')?.invalid &&
                (signUpForm.get('password')?.dirty || signUpForm.get('password')?.touched)
                  ? 'red'
                  : '',
            }"
          />
        </div>
        <div class="auth-checkbox">
          <input type="checkbox" name="accept" id="accept" formControlName="accept" />
          <label for="accept"
            >Я принимаю <a href="">условия пользовательского соглашения</a> и даю согласие
            <a href="">на обработку персональных данных.</a></label
          >
        </div>
      </div>
      <div class="auth-button">
        <button class="button" [disabled]="signUpForm.invalid" (click)="signup()">
          Зарегистрироваться
        </button>
      </div>
      <div class="auth-link">Уже есть аккаунт? <a routerLink="/login">Войдите</a></div>
    </div>
    <div class="page-image">
      <img src="assets/images/bg-signup.png" alt="signup-img" />
    </div>
  </div>
</section>
